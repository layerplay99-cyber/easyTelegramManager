# 说明：以下均为 Yarn 3 遗留配置，Yarn 4 已废弃或改名，保留会让 yarn 直接拒绝执行
# （报错 "Unrecognized or legacy configuration settings"），且 yarn 一次只报一个：
#   approvedGitRepositories -> Yarn 4 改名 gitRepoAllowedUrls
#   npmMinimalAgeGate       -> Yarn 4 已移除
# 本项目依赖均来自 npm registry、无 git 依赖，故直接移除。

enableGlobalCache: false

enableScripts: true

nodeLinker: node-modules
