# ============================================================================
# telegram-bot 项目接入层（只跑本项目 app 容器，接入共享栈 `stack` 网络）
# ----------------------------------------------------------------------------
# 前置：先在 /opt/docker-stack 部署并启动共享栈（见 docker-stack/README.md）
#   cd /opt/docker-stack
#   cp .env.example .env        # 设 STACK_ROOT / PROJECTS_ROOT（PROJECTS_ROOT 要与本项目一致）
#   docker compose build php node
#   docker compose up -d mysql pgsql nginx node
#                          ↑ 这里没有 redis：redis 由本项目自带（见下面 redis 服务），
#                            共享栈里已经没有这个服务了，写上会报 no such service: redis
#
# 本项目 .env 需设置：
#   PROJECTS_ROOT=/var/www        # 与共享栈 .env 的 PROJECTS_ROOT 保持一致（即项目代码所在的根目录）
#   PROJECT_DIR=easyTelegramManager  # 本项目在 PROJECTS_ROOT 下的目录名
#
# 项目代码统一挂到 /opt/projects/<PROJECT_DIR>，与共享 Nginx 的
# SCRIPT_FILENAME / 静态资源路径保持一致。
#
# 启动：docker compose up -d
# ============================================================================

name: telegram-bot

services:
    # ---------------------------------------------------------- PHP-FPM（app）
    php:
        image: telegram-bot-php:8.4
        container_name: tgbot-php
        working_dir: /opt/projects/${PROJECT_DIR:-easyTelegramManager}
        volumes:
            - ${PROJECTS_ROOT:-/var/www}/${PROJECT_DIR:-easyTelegramManager}:/opt/projects/${PROJECT_DIR:-easyTelegramManager}
            - ./docker-stack/php/php.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
            - ./docker-stack/php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
            # 与 telegram-py 共享：Python 下载的头像，PHP 侧要能读到
            - tgbot_media:/data/media
        environment:
            DB_HOST: mysql
            DB_PORT: 3306
            REDIS_HOST: redis
            REDIS_PORT: 6379
        networks:
            - stack

    # ---------------------------------------------------------- 前端（Node / vite dev）
    frontend:
        image: telegram-bot-node:20
        container_name: tgbot-frontend
        working_dir: /opt/projects/${PROJECT_DIR:-easyTelegramManager}/web
        # 一次性构建，不常驻 watch：
        #   yarn dev            = 开发服务器（HMR），只在内存里编译，**不会产出 web/dist**
        #   yarn build          = 产出 web/dist（nginx 静态托管读的就是它）
        #   yarn build --watch  = 构建完不退出，常驻一个 node 进程持续编译
        #
        # 以前用的是 build --watch（改代码自动出 dist），但它会一直占着一个 node 进程
        # 反复编译，内存紧的机器上很吃亏。现在容器起来只装依赖然后挂住（几乎不占资源），
        # 真正的构建在部署时执行一次：deploy.sh 的 build_frontend → docker exec ... yarn build。
        #
        # 想恢复「改前端代码自动出 dist」：把下面换回 `yarn install && yarn build --watch`。
        # 要改回 vite dev server：换回 `yarn dev --host 0.0.0.0 --port 5173`，
        # 同时 nginx 的 location / 必须改成反代 http://tgbot-frontend:5173（见 _dev.conf.example）。
        command: sh -c "yarn install && exec tail -f /dev/null"
        environment:
            # vite.config.ts 中 open: true（自动打开浏览器）。容器内无桌面环境，
            # 会报 "Error: spawn xdg-open ENOENT" —— 无害但刷屏。
            # BROWSER=none 禁掉自动打开即可消除，不影响 dev server 本身。
            BROWSER: none
        volumes:
            - ${PROJECTS_ROOT:-/var/www}/${PROJECT_DIR:-easyTelegramManager}/web:/opt/projects/${PROJECT_DIR:-easyTelegramManager}/web
            # node_modules 放容器卷，避免跨平台二进制互相覆盖
            - node_modules:/opt/projects/${PROJECT_DIR:-easyTelegramManager}/web/node_modules
        # 不映射宿主端口：静态资源由 nginx 托管 web/dist，dev server 也由 nginx 反代
        # tgbot-frontend:5173。需要从宿主直接调试时再自行加 ports（注意避开已占用端口）。
        restart: unless-stopped
        networks:
            - stack

    # ---------------------------------------------------------- 队列 worker
    queue:
        image: telegram-bot-php:8.4
        container_name: tgbot-queue
        working_dir: /opt/projects/${PROJECT_DIR:-easyTelegramManager}
        volumes:
            - ${PROJECTS_ROOT:-/var/www}/${PROJECT_DIR:-easyTelegramManager}:/opt/projects/${PROJECT_DIR:-easyTelegramManager}
            - ./docker-stack/php/php.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
            # SyncCollect 读取 Python 下载的头像
            - tgbot_media:/data/media
        # 只消费 default：轻量命令（/bd、/ye …）
        command: php artisan queue:work redis --queue=default --sleep=3 --tries=3 --timeout=180
        environment:
            DB_HOST: mysql
            REDIS_HOST: redis
        restart: unless-stopped
        networks:
            - stack

    # ---------------------------------------------------------- 队列 worker：识图专用
    #
    # 为什么要单独一条：
    #   worker 是串行的，识图单次 1~2s。图片和命令挤在一条队列上时，
    #   10 张图并发就能把 /bd、/ye 堵住十几秒。
    #   路由规则在 config/telegram.php 的 queues.by_media_type（photo → ocr）。
    #
    # 两条队列互不干扰，default 慢了不影响识图，识图堆积也不影响命令。
    # 图片量大就加 --scale：docker compose up -d --scale queue-ocr=3
    queue-ocr:
        image: telegram-bot-php:8.4
        container_name: tgbot-queue-ocr
        working_dir: /opt/projects/${PROJECT_DIR:-easyTelegramManager}
        volumes:
            - ${PROJECTS_ROOT:-/var/www}/${PROJECT_DIR:-easyTelegramManager}:/opt/projects/${PROJECT_DIR:-easyTelegramManager}
            - ./docker-stack/php/php.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
            - tgbot_media:/data/media
        # 只消费 ocr；OCR 本身有 15s 硬超时，--timeout 给它留够余量
        command: php artisan queue:work redis --queue=ocr --sleep=3 --tries=2 --timeout=120
        environment:
            DB_HOST: mysql
            REDIS_HOST: redis
        restart: unless-stopped
        networks:
            - stack

    # ---------------------------------------------------------- Reverb（WebSocket）
    reverb:
        image: telegram-bot-php:8.4
        container_name: tgbot-reverb
        working_dir: /opt/projects/${PROJECT_DIR:-easyTelegramManager}
        # 不映射宿主端口：WebSocket 由 nginx 的 /app 反代到 tgbot-reverb:8080（走 stack 网络），
        # 避免与宿主上已占用 8080 的容器冲突。
        volumes:
            - ${PROJECTS_ROOT:-/var/www}/${PROJECT_DIR:-easyTelegramManager}:/opt/projects/${PROJECT_DIR:-easyTelegramManager}
            - ./docker-stack/php/php.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        environment:
            DB_HOST: mysql
            REDIS_HOST: redis
        restart: unless-stopped
        networks:
            - stack

    # ---------------------------------------------------------- Telethon（Python MTProto 服务）
    # 真实用户账号的 MTProto 能力全部由它承担；事件回调 Laravel。
    telegram-py:
        build:
            context: ./telegram-service
            dockerfile: Dockerfile
        image: telegram-bot-telethon:latest
        # 同时写了 build 和 image 时，Compose 会先去 registry 拉镜像，拉不到才构建，
        # 导致满屏 "pull access denied"。强制本地构建。
        pull_policy: build
        container_name: tgbot-telethon
        working_dir: /app
        environment:
            SESSIONS_DIR: /data/sessions
            MEDIA_DIR: /data/media
            # php 容器是 php-fpm(9000 fastcgi)，不提供 HTTP；必须走共享栈的 nginx
            LARAVEL_BASE_URL: http://stack-nginx
            # nginx 按 server_name 选 vhost，所以回调要带一个能命中本项目 vhost 的 Host。
            # 生产 vhost（deploy.sh 生成）的 server_name 是真实域名，
            # 所以这里跟域名走；域名不需要能解析 —— 请求打的是 LARAVEL_BASE_URL，
            # Host 头只是给 nginx 做匹配用的。
            # deploy.sh 会把 TELETHON_CALLBACK_HOST 写成域名写进 .env；
            # 没跑 deploy.sh 时才回落到 tgbot.local（本机开发那份 _dev.conf.example）。
            LARAVEL_HOST: ${TELETHON_CALLBACK_HOST:-tgbot.local}
            CALLBACK_TOKEN: ${TELETHON_CALLBACK_TOKEN}
            REDIS_URL: redis://redis:6379/0
        volumes:
            - tgbot_media:/data
        # 不映射宿主端口：Laravel 通过 TELETHON_BASE_URL=http://telegram-py:8081 内部调用，
        # 避免与宿主上已占用 8081 的容器冲突。
        restart: unless-stopped
        networks:
            - stack

    # ---------------------------------------------------------- Telegram Bot API Server（本地 TDLib）
    #
    # 把 Bot API 出站调用从公网的 api.telegram.org 换成本机 TDLib 服务：
    #   延迟：走 stack 内网，省掉公网往返
    #   文件：加 --local 后上限 2GB（云端是下载 20MB / 上传 50MB）
    #   对业务无感：token、方法名、返回结构都不变，只是换个 base url
    # 部署与运维要点见 docs/telegram-bot-api-server.md
    #
    # 启用步骤（三步都要做，少一步等于没启用）：
    #   1. 项目 .env 填 TELEGRAM_API_ID / TELEGRAM_API_HASH（my.telegram.org 申请）
    #   2. 项目 .env 设 TELEGRAM_BASE_BOT_URL=http://telegram-bot-api:8083/bot
    #      —— 只起容器不设这个，出站仍走官方，容器白起
    #   3. docker compose up -d telegram-bot-api
    #      docker exec tgbot-php php artisan config:clear   # 用了 config:cache 就再 cache 一次
    #      后台每个机器人重新「关闭 → 激活」，再用「查看状态」确认
    #
    # 注意三点：
    #   · 不映射宿主端口。这个 HTTP 端口无任何鉴权，谁连上谁就能用你挂的所有
    #     bot token 发消息；PHP 通过服务名 telegram-bot-api:8083 在 stack 网络内访问。
    #   · 端口 8083 是避开 telegram-py（Telethon）的 8081 选的，别改回去。
    #   · ⚠️ 只能靠环境变量配置，不要写 command:
    #     镜像的 docker-entrypoint.sh 用环境变量拼命令行，最后一行是 `exec $COMMAND`
    #     （不带 "$@"）—— compose 里写的 command 会被静默丢弃，
    #     而它校验的 TELEGRAM_API_ID 等又必须在容器 env 里，结果就是起来就退出刷：
    #     "error: expected TELEGRAM_API_ID or TELEGRAM_API_ID_FILE env vars to be set"
    telegram-bot-api:
        image: aiogram/telegram-bot-api:latest
        container_name: tgbot-bot-api
        environment:
            # 必填：TDLib 身份。也可改用 TELEGRAM_API_ID_FILE / TELEGRAM_API_HASH_FILE
            # 指向 secret 文件（二选一，同时给会报错）
            TELEGRAM_API_ID: ${TELEGRAM_API_ID}
            TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
            # 必填：entrypoint 启动时会对 WORK_DIR 做 chown
            TELEGRAM_WORK_DIR: /data
            # /tmp 容器内一定存在且 1777 可写（容器里没有 systemd 的 PrivateTmp 隔离），
            # 比指向持久卷里一个可能还不存在的子目录稳。
            TELEGRAM_TEMP_DIR: /tmp
            # 本地模式：不加就是云端那套 20MB/50MB 限制
            TELEGRAM_LOCAL: 1
            TELEGRAM_HTTP_PORT: 8083
            TELEGRAM_LOG_FILE: /data/telegram-bot-api.log
            TELEGRAM_VERBOSITY: 2
        volumes:
            # --dir 是文件缓存，只增不减，必须持久化。
            # 清掉后已下载文件的 file_path 失效（需重新下载），不影响新消息。
            # file_path / file_id 与实例绑定，所以只能单实例 + 持久卷，不要跑多副本。
            - tgbot_botapi:/data
        restart: unless-stopped
        networks:
            - stack

    # ---------------------------------------------------------- 旧版 MadelineProto 常驻监听（默认不启动）
    # 事件处理已改由 Python Telethon 负责，默认关闭以避免双处理。
    # 如需回退：docker compose --profile madeline-legacy up -d telegram
    telegram:
        image: telegram-bot-php:8.4
        container_name: tgbot-telegram
        working_dir: /opt/projects/${PROJECT_DIR:-easyTelegramManager}
        volumes:
            - ${PROJECTS_ROOT:-/var/www}/${PROJECT_DIR:-easyTelegramManager}:/opt/projects/${PROJECT_DIR:-easyTelegramManager}
            - ./docker-stack/php/php.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
        command: php artisan telegram:multi-listen
        environment:
            DB_HOST: mysql
            REDIS_HOST: redis
        restart: unless-stopped
        profiles: ["madeline-legacy"]
        networks:
            - stack

    # ---------------------------------------------------------- Redis（项目自带，独立）
    # 不依赖共享栈的 stack-redis：本机已有 easycall-redis，stack-redis 与其共用数据
    # 目录/端口会起不来（曾 Exited 139），导致 tgbot-php 在 stack 网络解析不到 redis、
    # webhook 推队列失败 → 群不同步。这里单独起一个 redis：独占命名卷、不映射宿主端口，
    # 借服务名 redis 在 stack 网络提供别名；tgbot-php/queue/reverb 的 REDIS_HOST=redis
    # 即解析到它，与共享栈的 redis 彻底解耦。
    # 前提：删除/停用共享栈的 stack-redis，释放 stack 网络上的 redis 别名。
    redis:
        image: redis:7-alpine
        container_name: tgbot-redis
        restart: unless-stopped
        volumes:
            - tgbot_redis:/data
        networks:
            - stack

volumes:
    node_modules:
    tgbot_media:
    tgbot_redis:
    tgbot_botapi:      # Telegram Bot API Server 的文件缓存（--dir）

networks:
    stack:
        name: stack
        external: true
