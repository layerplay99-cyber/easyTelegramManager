# ============================================================================
# telegram-bot 项目接入层（只跑本项目 app 容器，接入共享栈 `stack` 网络）
# ----------------------------------------------------------------------------
# 前置：先在 /opt/docker-stack 部署并启动共享栈（见 docker-stack/README.md）
#   cd /opt/docker-stack
#   cp .env.example .env        # 设 STACK_ROOT / PROJECTS_ROOT（PROJECTS_ROOT 要与本项目一致）
#   docker compose build php node
#   docker compose up -d mysql redis pgsql nginx node
#
# 本项目 .env 需设置：
#   PROJECTS_ROOT=/var/www        # 与共享栈 .env 的 PROJECTS_ROOT 保持一致（即项目代码所在的根目录）
#   PROJECT_DIR=easyTelegramManager  # 本项目在 PROJECTS_ROOT 下的目录名
#
# 项目代码统一挂到 /opt/projects/<PROJECT_DIR>，与共享 Nginx 的
# SCRIPT_FILENAME / 静态资源路径保持一致。
#
# 启动：docker compose up -d
# ============================================================================

name: telegram-bot

services:
    # ---------------------------------------------------------- PHP-FPM（app）
    php:
        image: stack-php:8.4
        container_name: tgbot-php
        working_dir: /opt/projects/${PROJECT_DIR:-easyTelegramManager}
        volumes:
            - ${PROJECTS_ROOT:-/var/www}/${PROJECT_DIR:-easyTelegramManager}:/opt/projects/${PROJECT_DIR:-easyTelegramManager}
            - ./docker-stack/php/php.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
            - ./docker-stack/php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
            # 与 telegram-py 共享：Python 下载的头像，PHP 侧要能读到
            - tgbot_media:/data/media
        environment:
            DB_HOST: mysql
            DB_PORT: 3306
            REDIS_HOST: redis
            REDIS_PORT: 6379
        networks:
            - stack

    # ---------------------------------------------------------- 前端（Node / vite dev）
    frontend:
        image: stack-node:20
        container_name: tgbot-frontend
        working_dir: /opt/projects/${PROJECT_DIR:-easyTelegramManager}/web
        command: sh -c "yarn install && yarn dev --host 0.0.0.0 --port 5173"
        volumes:
            - ${PROJECTS_ROOT:-/var/www}/${PROJECT_DIR:-easyTelegramManager}/web:/opt/projects/${PROJECT_DIR:-easyTelegramManager}/web
            # node_modules 放容器卷，避免跨平台二进制互相覆盖
            - node_modules:/opt/projects/${PROJECT_DIR:-easyTelegramManager}/web/node_modules
        ports:
            - "5173:5173"
        restart: unless-stopped
        networks:
            - stack

    # ---------------------------------------------------------- 队列 worker
    queue:
        image: stack-php:8.4
        container_name: tgbot-queue
        working_dir: /opt/projects/${PROJECT_DIR:-easyTelegramManager}
        volumes:
            - ${PROJECTS_ROOT:-/var/www}/${PROJECT_DIR:-easyTelegramManager}:/opt/projects/${PROJECT_DIR:-easyTelegramManager}
            - ./docker-stack/php/php.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
            # SyncCollect 读取 Python 下载的头像
            - tgbot_media:/data/media
        command: php artisan queue:work redis --queue=default --sleep=3 --tries=3 --timeout=180
        environment:
            DB_HOST: mysql
            REDIS_HOST: redis
        restart: unless-stopped
        networks:
            - stack

    # ---------------------------------------------------------- Reverb（WebSocket）
    reverb:
        image: stack-php:8.4
        container_name: tgbot-reverb
        working_dir: /opt/projects/${PROJECT_DIR:-easyTelegramManager}
        ports:
            - "8080:8080"
        volumes:
            - ${PROJECTS_ROOT:-/var/www}/${PROJECT_DIR:-easyTelegramManager}:/opt/projects/${PROJECT_DIR:-easyTelegramManager}
            - ./docker-stack/php/php.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        environment:
            DB_HOST: mysql
            REDIS_HOST: redis
        restart: unless-stopped
        networks:
            - stack

    # ---------------------------------------------------------- Telethon（Python MTProto 服务）
    # 真实用户账号的 MTProto 能力全部由它承担；事件回调 Laravel。
    telegram-py:
        build:
            context: ./telegram-service
            dockerfile: Dockerfile
        image: tgbot-telethon:latest
        container_name: tgbot-telethon
        working_dir: /app
        environment:
            SESSIONS_DIR: /data/sessions
            MEDIA_DIR: /data/media
            # php 容器是 php-fpm(9000 fastcgi)，不提供 HTTP；必须走共享栈的 nginx
            LARAVEL_BASE_URL: http://stack-nginx
            # nginx 按 server_name 路由，请求需带正确 Host，否则落到 default_server 返回 404
            LARAVEL_HOST: tgbot.local
            CALLBACK_TOKEN: ${TELETHON_CALLBACK_TOKEN}
            REDIS_URL: redis://redis:6379/0
        volumes:
            - tgbot_media:/data
        ports:
            - "8081:8081"
        restart: unless-stopped
        networks:
            - stack

    # ---------------------------------------------------------- 旧版 MadelineProto 常驻监听（默认不启动）
    # 事件处理已改由 Python Telethon 负责，默认关闭以避免双处理。
    # 如需回退：docker compose --profile madeline-legacy up -d telegram
    telegram:
        image: stack-php:8.4
        container_name: tgbot-telegram
        working_dir: /opt/projects/${PROJECT_DIR:-easyTelegramManager}
        volumes:
            - ${PROJECTS_ROOT:-/var/www}/${PROJECT_DIR:-easyTelegramManager}:/opt/projects/${PROJECT_DIR:-easyTelegramManager}
            - ./docker-stack/php/php.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
        command: php artisan telegram:multi-listen
        environment:
            DB_HOST: mysql
            REDIS_HOST: redis
        restart: unless-stopped
        profiles: ["madeline-legacy"]
        networks:
            - stack

volumes:
    node_modules:
    tgbot_media:

networks:
    stack:
        name: stack
        external: true
