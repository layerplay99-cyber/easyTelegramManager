# ============================================================================
# telegram-bot 项目接入层（只跑本项目 app 容器，接入共享栈 `stack` 网络）
# ----------------------------------------------------------------------------
# 前置：先在 /opt/docker-stack 部署并启动共享栈（见 docker-stack/README.md）
#   docker compose -f /opt/docker-stack/docker-compose.yml up -d mysql redis pgsql nginx node
#   docker compose -f /opt/docker-stack/docker-compose.yml build php node
#
# 本项目的公共镜像（stack-php:8.4 / stack-node:20）由共享栈构建，这里直接引用，
# 不再各自 build。项目代码统一挂到 /opt/projects/telegram-bot，与共享 Nginx
# 的 SCRIPT_FILENAME / 静态资源路径保持一致。
#
# 启动：docker compose up -d
# ============================================================================

name: telegram-bot

services:
    # ---------------------------------------------------------- PHP-FPM（app）
    php:
        image: stack-php:8.4
        container_name: tgbot-php
        working_dir: /opt/projects/telegram-bot
        volumes:
            - ${PROJECTS_ROOT}/telegram-bot:/opt/projects/telegram-bot
            - ./docker-stack/php/php.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
            - ./docker-stack/php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
            # vendor 放命名卷：Linux 下仍建议隔离，避免污染项目目录
            - vendor:/opt/projects/telegram-bot/vendor
        environment:
            DB_HOST: mysql
            DB_PORT: 3306
            REDIS_HOST: redis
            REDIS_PORT: 6379
        networks:
            - stack

    # ---------------------------------------------------------- 前端（Node / vite dev）
    frontend:
        image: stack-node:20
        container_name: tgbot-frontend
        working_dir: /opt/projects/telegram-bot/web
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
        volumes:
            - ${PROJECTS_ROOT}/telegram-bot/web:/opt/projects/telegram-bot/web
            # node_modules 放容器卷，避免跨平台二进制互相覆盖
            - node_modules:/opt/projects/telegram-bot/web/node_modules
        ports:
            - "5173:5173"
        networks:
            - stack

    # ---------------------------------------------------------- 队列 worker
    queue:
        image: stack-php:8.4
        container_name: tgbot-queue
        working_dir: /opt/projects/telegram-bot
        volumes:
            - ${PROJECTS_ROOT}/telegram-bot:/opt/projects/telegram-bot
            - ./docker-stack/php/php.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
            - vendor:/opt/projects/telegram-bot/vendor
        command: php artisan queue:work redis --queue=default --sleep=3 --tries=3 --timeout=180
        environment:
            DB_HOST: mysql
            REDIS_HOST: redis
        restart: unless-stopped
        networks:
            - stack

    # ---------------------------------------------------------- Reverb（WebSocket）
    reverb:
        image: stack-php:8.4
        container_name: tgbot-reverb
        working_dir: /opt/projects/telegram-bot
        ports:
            - "8080:8080"
        volumes:
            - ${PROJECTS_ROOT}/telegram-bot:/opt/projects/telegram-bot
            - ./docker-stack/php/php.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
            - vendor:/opt/projects/telegram-bot/vendor
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        environment:
            DB_HOST: mysql
            REDIS_HOST: redis
        restart: unless-stopped
        networks:
            - stack

    # ---------------------------------------------------------- Telegram 常驻监听
    # MadelineProto 仅支持 Linux/Mac，必须进容器运行。
    telegram:
        image: stack-php:8.4
        container_name: tgbot-telegram
        working_dir: /opt/projects/telegram-bot
        volumes:
            - ${PROJECTS_ROOT}/telegram-bot:/opt/projects/telegram-bot
            - ./docker-stack/php/php.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
            - vendor:/opt/projects/telegram-bot/vendor
        command: php artisan telegram:multi-listen
        environment:
            DB_HOST: mysql
            REDIS_HOST: redis
        restart: unless-stopped
        networks:
            - stack

volumes:
    vendor:
    node_modules:

networks:
    stack:
        name: stack
        external: true
