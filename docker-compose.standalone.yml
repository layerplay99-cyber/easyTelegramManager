# ============================================================================
# telegram-bot —— 独立部署（standalone）
# ----------------------------------------------------------------------------
# 与仓库根的 docker-compose.yml 的区别：
#   · docker-compose.yml        接入已有共享栈（external 网络 stack，需要 /opt/docker-stack）
#   · docker-compose.standalone 自包含：MySQL / Redis / PHP / Nginx 全在这一套里
#
# 面向「只用 curl 装一次的客户机器」，由 install.sh 驱动，不需要 git、不需要预装 PHP。
# 端口、域名、密码全从同目录 .env 读取（install.sh 生成）。
# ============================================================================

name: easytg

services:
    mysql:
        image: mysql:8.0
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
            interval: 10s
            timeout: 5s
            retries: 12

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 10

    # ---------------------------------------------------------- PHP-FPM
    php:
        build:
            context: ./docker-stack/php
            dockerfile: Dockerfile
        image: easytg-php:8.4
        working_dir: /var/www/html
        restart: unless-stopped
        volumes:
            - ./:/var/www/html
            - ./docker-stack/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
            - ./docker-stack/php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
            - media:/data/media
        environment:
            DB_HOST: mysql
            DB_PORT: 3306
            REDIS_HOST: redis
            REDIS_PORT: 6379
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    # ---------------------------------------------------------- Nginx（含官网）
    nginx:
        image: nginx:1.27-alpine
        restart: unless-stopped
        ports:
            - "${HTTP_PORT:-80}:80"
            - "${HTTPS_PORT:-443}:443"
        volumes:
            - ./:/var/www/html:ro
            - ./site:/var/www/site:ro
            - ./docker/nginx-standalone.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php

    # ---------------------------------------------------------- 队列 worker
    queue:
        image: easytg-php:8.4
        working_dir: /var/www/html
        restart: unless-stopped
        command: php artisan queue:work redis --queue=default --sleep=3 --tries=3 --timeout=180
        volumes:
            - ./:/var/www/html
            - ./docker-stack/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
            - media:/data/media
        environment:
            DB_HOST: mysql
            REDIS_HOST: redis
        depends_on:
            php:
                condition: service_started

    # ---------------------------------------------------------- 队列 worker：识图
    queue-ocr:
        image: easytg-php:8.4
        working_dir: /var/www/html
        restart: unless-stopped
        command: php artisan queue:work redis --queue=ocr --sleep=3 --tries=2 --timeout=120
        volumes:
            - ./:/var/www/html
            - ./docker-stack/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
            - media:/data/media
        environment:
            DB_HOST: mysql
            REDIS_HOST: redis
        depends_on:
            php:
                condition: service_started

    # ---------------------------------------------------------- Reverb（WebSocket）
    reverb:
        image: easytg-php:8.4
        working_dir: /var/www/html
        restart: unless-stopped
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        volumes:
            - ./:/var/www/html
            - ./docker-stack/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
        environment:
            DB_HOST: mysql
            REDIS_HOST: redis
        depends_on:
            php:
                condition: service_started

    # ---------------------------------------------------------- Telethon（真人号，可选）
    # 默认不启动：install.sh --with-telethon 才会带 --profile telethon 起来。
    telegram-py:
        build:
            context: ./telegram-service
            dockerfile: Dockerfile
        image: easytg-telethon:latest
        pull_policy: build
        restart: unless-stopped
        profiles: ["telethon"]
        environment:
            SESSIONS_DIR: /data/sessions
            MEDIA_DIR: /data/media
            LARAVEL_BASE_URL: http://nginx
            LARAVEL_HOST: ${DOMAIN}
            CALLBACK_TOKEN: ${TELETHON_CALLBACK_TOKEN:-}
            REDIS_URL: redis://redis:6379/0
        volumes:
            - media:/data
        depends_on:
            php:
                condition: service_started

volumes:
    mysql_data:
    redis_data:
    media:
