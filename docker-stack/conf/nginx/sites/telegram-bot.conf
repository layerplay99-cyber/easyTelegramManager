# ============================================================================
# telegram-bot 项目虚拟主机（由共享 Nginx 加载）
# ----------------------------------------------------------------------------
# 前置：telegram-bot 项目的 app 容器已接入 `stack` 网络，容器名分别为：
#   tgbot-php / tgbot-frontend / tgbot-reverb
# 本文件随 docker-stack 一起挂载到 /etc/nginx/sites，无需重启 nginx 即可生效
# （改完执行：docker compose -f /opt/docker-stack/docker-compose.yml exec nginx nginx -s reload）
#
# 本机访问需在 /etc/hosts 添加：  127.0.0.1 tgbot.local
# ============================================================================

server {
    listen 80;
    server_name tgbot.local;

    client_max_body_size 50m;

    # ---- 前端 SPA（vite dev，含 HMR）----
    # 生产环境可改为直接 serve 构建产物 web/dist（见文末注释）。
    location / {
        proxy_pass             http://tgbot-frontend:5173;
        proxy_http_version     1.1;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        # HMR websocket
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_read_timeout     3600s;
    }

    # ---- API：交给 php-fpm ----
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass   tgbot-php:9000;
        fastcgi_index  index.php;
        # 与 php/app 容器内挂载路径一致：/opt/projects/easyTelegramManager
        fastcgi_param  SCRIPT_FILENAME /opt/projects/easyTelegramManager/public$fastcgi_script_name;
        include        fastcgi_params;
    }

    # ---- Reverb WebSocket 反代 ----
    location /app {
        proxy_pass             http://tgbot-reverb:8080;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "Upgrade";
        proxy_set_header       Host $host;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }
}

# ============================================================================
# ============================================================================
# 【路由约定：单域名 + path 区分】
#   /            -> 前端页面
#   /api         -> 后端接口（php-fpm）
#   /app         -> Reverb WebSocket（反代到 tgbot-reverb:8080）
#
# 前端 web/.env* 必须与此保持一致（尤其 VITE_REVERB_PORT 要填 Nginx 的端口，
# 不是 reverb 的 8080）：
#   VITE_BASE_URL      = http://<域名>/api
#   VITE_REVERB_HOST   = <域名>
#   VITE_REVERB_PORT   = 80   （HTTPS 时填 443）
#   VITE_REVERB_SCHEME = http （HTTPS 时填 https）
#   VITE_WSS_URL       = ws://<域名>/app （HTTPS 时 wss://<域名>/app）
# ============================================================================

# ----------------------------------------------------------------------------
# 生产环境（推荐）：`yarn build` 产出 web/dist 后由 Nginx 直接托管静态，
# 不再依赖 tgbot-frontend 容器。把上面 location / 替换为：
#
#   location / {
#       root /opt/projects/easyTelegramManager/web/dist;
#       try_files $uri $uri/ /index.html;
#   }
#   location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
#       root /opt/projects/easyTelegramManager/web/dist;
#       expires 7d;
#       add_header Cache-Control "public";
#   }
#
# 需要 HTTPS 时，在 server 块加：
#   listen 443 ssl;
#   ssl_certificate     /etc/nginx/ssl/<域名>/fullchain.pem;
#   ssl_certificate_key /etc/nginx/ssl/<域名>/privkey.pem;
# 并另加一个 80 端口的 server 做 301 跳转：
#   server { listen 80; server_name <域名>; return 301 https://$host$request_uri; }
# ----------------------------------------------------------------------------
