services:
    # ---------------------------------------------------------------- PHP-FPM
    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: tgbot-php
        working_dir: /var/www
        volumes:
            - .:/var/www
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
            - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
            # vendor 放容器卷里：Docker 挂载 Windows NTFS 目录时小文件 I/O 极慢，
            # vendor 有一万多个类文件，放 NTFS 上每个请求要多花好几秒
            - vendor:/var/www/vendor
        environment:
            DB_HOST: mysql
            DB_PORT: 3306
            REDIS_HOST: redis
            REDIS_PORT: 6379
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - tgbot

    # ---------------------------------------------------------------- Nginx
    nginx:
        image: nginx:1.27-alpine
        container_name: tgbot-nginx
        ports:
            - "8088:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php
        networks:
            - tgbot

    # ---------------------------------------------------------------- MySQL
    mysql:
        image: mysql:8.0
        container_name: tgbot-mysql
        ports:
            - "3307:3306"
        command: --default-authentication-plugin=mysql_native_password
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: bots
            MYSQL_USER: bots
            MYSQL_PASSWORD: bots123456
            TZ: Asia/Shanghai
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 30
        networks:
            - tgbot

    # ---------------------------------------------------------------- Redis
    redis:
        image: redis:7-alpine
        container_name: tgbot-redis
        ports:
            - "6380:6379"
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - redis-data:/data
        networks:
            - tgbot

    # ---------------------------------------------------------------- 队列
    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: tgbot-queue
        working_dir: /var/www
        volumes:
            - .:/var/www
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
            - vendor:/var/www/vendor
        command: php artisan queue:work redis --queue=default --sleep=3 --tries=3 --timeout=180
        environment:
            DB_HOST: mysql
            REDIS_HOST: redis
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        restart: unless-stopped
        networks:
            - tgbot

    # ---------------------------------------------------------------- Reverb
    reverb:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: tgbot-reverb
        working_dir: /var/www
        ports:
            - "8080:8080"
        volumes:
            - .:/var/www
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
            - vendor:/var/www/vendor
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        environment:
            DB_HOST: mysql
            REDIS_HOST: redis
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        restart: unless-stopped
        networks:
            - tgbot

    # ---------------------------------------------------- Telegram 常驻监听
    # MadelineProto 在 Windows 上跑不了（官方明确只支持 Linux/Mac），必须进容器
    telegram:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: tgbot-telegram
        working_dir: /var/www
        volumes:
            - .:/var/www
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
            - vendor:/var/www/vendor
        command: php artisan telegram:multi-listen
        environment:
            DB_HOST: mysql
            REDIS_HOST: redis
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        restart: unless-stopped
        networks:
            - tgbot

    # 前端不进容器：node_modules 里 esbuild/rollup 是 Windows 二进制，
    # 在 Linux 容器里装又会覆盖宿主机的 node_modules。
    # 前端仍在 Windows 上跑：cd web && npm run dev  -> http://127.0.0.1:8001
    # （web/.env.development 的 VITE_BASE_URL 已指向容器 Nginx 8088）

volumes:
    mysql-data:
    redis-data:
    vendor:

networks:
    tgbot:
