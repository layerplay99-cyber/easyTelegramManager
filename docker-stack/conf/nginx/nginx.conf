user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $host - "$request"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;

    # ------------------------------------------------------------------------
    # 动态解析上游容器（必须配，别删）
    #
    # nginx 对写死的上游名字（fastcgi_pass tgbot-php:9000）默认只在**启动/重载时
    # 解析一次**并永久缓存 IP。php / reverb 容器一旦重建，内网 IP 就变了，
    # nginx 还往旧 IP 发请求 → /api/* 全部 502，而 php-fpm 自己的日志是干净的，
    # 极易误判成 PHP 挂了。
    #
    # 配了 resolver、且 sites/*.conf 里把上游写成变量（set $xxx "host:port"），
    # nginx 才会按 valid 周期重新解析，容器随便重建都不会再断。
    #
    # 127.0.0.11 是 Docker 内嵌 DNS（每个容器里都有）；ipv6=off 避免解析到 AAAA
    # 记录后连接失败。
    # ------------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 全局默认站点（未匹配到具体项目的 Host 时返回提示）
    include /etc/nginx/conf.d/*.conf;
    # 各项目虚拟主机：把项目 vhost 放到 sites/ 目录即可生效
    include /etc/nginx/sites/*.conf;
}
